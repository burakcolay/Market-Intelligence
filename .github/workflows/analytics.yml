name: Analiz (Python)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily ya da weekly (rapor + defterler)'
        default: 'weekly'
  push:
    branches: [main]
    paths: ['data/daily/*.json', 'analytics/mi/**', 'analytics/sql/**', 'analytics/notebooks/build.py', 'analytics/requirements.txt']
  workflow_run:                # SEC/fiyat işi bitince, onun yazdığı en güncel veriyle çalış
    workflows: ['ABD verisi']
    types: [completed]
permissions:
  contents: write
concurrency: analytics
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - name: Kurulum
        run: pip install -r requirements.txt
      - name: Testler
        run: python -m pytest -q tests
      - name: Veri hattı ve analiz
        env:
          MSG: ${{ github.event.head_commit.message }}   # "veri:" ile başlayan sabah commit'i günlük modda çalışsın
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "$(date -u +%u)" = "6" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${MSG#veri:}" = "$MSG" ]; }; then MODE=weekly; else MODE=daily; fi
          fi
          echo "MODE=$MODE" >> $GITHUB_ENV
          python -m mi.run "$MODE"
      - name: Defterleri çalıştır (haftalık)
        if: env.MODE == 'weekly'
        run: |
          python notebooks/build.py
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=600 notebooks/0*.ipynb
      - name: Commit (Burak adına, Vercel için)
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          git config user.name "Burak Colay"
          git config user.email "170448628+burakcolay@users.noreply.github.com"
          git add data/analytics analytics/data/prices analytics/data/long reports analytics/notebooks
          git diff --cached --quiet && exit 0
          git commit -m "analiz: $(date -u +%F) ($MODE)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
